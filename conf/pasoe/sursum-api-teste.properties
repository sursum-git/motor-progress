# Referencia operacional para clonar a instancia PASOE de producao para teste.

instance.name=sursum-api-teste
instance.source=sursum-api
instance.host=192.168.0.111

http.port=9920
https.port=9921
shutdown.port=9922
ajp.port=9923
jmx.registry.port=10101
jmx.server.port=10102
healthcheck.port=8898

database.pf=C:\opencode\motor-progress\conf\pasoe\datasul-teste-databases.pf
aliases.file=C:\opencode\motor-progress\conf\pasoe\datasul-teste-aliases.p

# A base teste usa os mesmos sufixos da producao, trocando a casa de milhar
# das portas de banco de 1 para 2.
database.host=192.168.0.111
