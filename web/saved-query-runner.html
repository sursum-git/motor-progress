<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Executor de Consultas Salvas</title>
  <link rel="stylesheet" href="vendor/kendo/styles/default-main.css">
  <link rel="stylesheet" href="ui-ready.css?v=20260617-grid-center">
  <style>
    body {
      margin: 0;
      padding: 16px;
      height: 100vh;
      overflow: hidden;
      background: #f4f6f8;
      color: #1f2933;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .toolbar,
    .parameters,
    .status {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 8px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 12px;
    }
    .parameters {
      display: grid;
      gap: 10px;
      padding: 12px;
    }
    .parameter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    label {
      display: grid;
      gap: 4px;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      color: #344150;
    }
    label span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    input {
      box-sizing: border-box;
      min-height: 34px;
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #b8c2cc;
      border-radius: 6px;
      font: inherit;
    }
    button {
      min-height: 34px;
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      background: #8fa4cf;
      cursor: wait;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-left: 4px solid #1d4ed8;
      color: #344150;
    }
    .request-preview {
      min-height: 110px;
      max-height: 220px;
      margin: 0;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #d8dee4;
      border-radius: 6px;
      background: #fbfcfd;
      font-size: 12px;
      line-height: 1.45;
    }
    .muted {
      margin: 0;
      color: #5f6b7a;
      font-size: 12px;
    }
    .grid-shell {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    .grid-shell.grid-maximized {
      position: fixed;
      inset: 16px;
      z-index: 1000;
      padding: 0;
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      box-shadow: 0 16px 44px rgba(15, 23, 42, 0.25);
    }
    #resultGrid {
      height: 100%;
      min-height: 0;
    }
    .grid-close {
      display: none;
      margin-left: auto;
      min-height: 30px;
      padding: 5px 10px;
    }
    .sursum-column-lock-actions {
      display: grid;
      gap: 2px;
      padding: 4px 0;
      border-top: 1px solid #d8dee4;
    }
    .sursum-column-menu-action {
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #1f2933;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .sursum-column-menu-action:hover {
      background: #eef2f7;
    }
    @media (max-width: 720px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .status {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="sursum-ui-pending">
  <main>
    <div class="toolbar">
      <label>
        <span>Consulta salva</span>
        <input id="savedQueryCombo">
      </label>
      <button id="runButton" type="button">Executar</button>
    </div>

    <div class="parameters">
      <p id="queryInfo" class="muted">Selecione uma consulta salva.</p>
      <div id="parameterFields" class="parameter-grid"></div>
      <pre id="requestPreview" class="request-preview"></pre>
    </div>

    <div class="status">
      <span id="statusBox">Carregando consultas salvas.</span>
      <button id="maximizeGridButton" type="button">Maximizar grid</button>
    </div>
    <div id="gridShell" class="grid-shell">
      <button id="closeMaximizedGridButton" class="grid-close" type="button">Fechar</button>
      <div id="resultGrid"></div>
    </div>
  </main>

  <script src="vendor/jquery/jquery-4.0.0.min.js"></script>
  <script src="vendor/kendo/examples/content/shared/js/jszip.min.js"></script>
  <script src="vendor/kendo/js/kendo.all.min.js"></script>
  <script src="vendor/kendo/js/cultures/kendo.culture.pt-BR.min.js"></script>
  <script src="vendor/kendo/js/messages/kendo.messages.pt-BR.min.js"></script>
  <script src="vendor/kendo/kendo-license.js"></script>
  <script src="auth-guard.js"></script>
  <script src="context-manager.js"></script>
  <script src="ui-ready.js?v=20260616-grid-loading"></script>
  <script>
    (function () {
      "use strict";

      const DEFAULT_API_BASE = "https://192.168.0.111:9911/med/web/SursumDynamicQuery";
      let selectedQuery = null;
      let currentRecords = [];
      const lockedColumns = new Set();

      const statusBox = document.getElementById("statusBox");
      const queryInfo = document.getElementById("queryInfo");
      const parameterFields = document.getElementById("parameterFields");
      const requestPreview = document.getElementById("requestPreview");
      const runButton = document.getElementById("runButton");
      const gridShell = document.getElementById("gridShell");
      const maximizeGridButton = document.getElementById("maximizeGridButton");
      const closeMaximizedGridButton = document.getElementById("closeMaximizedGridButton");

      function setStatus(message) {
        statusBox.textContent = message;
      }

      function pretty(value) {
        return JSON.stringify(value, null, 2);
      }

      function currentApiBase() {
        if (window.SursumContext && typeof SursumContext.getCurrentApiBase === "function") {
          return String(SursumContext.getCurrentApiBase() || DEFAULT_API_BASE).replace(/\/+$/, "");
        }
        return DEFAULT_API_BASE;
      }

      function pasoeProxyUrl(path) {
        return "pasoe-proxy.php?target=" + encodeURIComponent(currentApiBase() + path);
      }

      async function getJson(url) {
        const response = await fetch(url, { credentials: "same-origin", cache: "no-store" });
        const text = await response.text();
        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error(text || error.message);
        }
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(body)
        });
        const text = await response.text();
        try {
          return { status: response.status, payload: JSON.parse(text), raw: text };
        } catch (error) {
          return { status: response.status, payload: null, raw: text };
        }
      }

      function combo() {
        return $("#savedQueryCombo").data("kendoComboBox");
      }

      function grid() {
        return $("#resultGrid").data("kendoGrid");
      }

      function normalizeFieldName(filter) {
        return String(filter && filter.name || "").trim();
      }

      function renderParameterFields(filters) {
        parameterFields.innerHTML = "";
        if (!filters.length) {
          const message = document.createElement("p");
          message.className = "muted";
          message.textContent = "A consulta selecionada nao declara parametros externos.";
          parameterFields.appendChild(message);
          return;
        }
        filters.forEach(function (filter) {
          const name = normalizeFieldName(filter);
          const label = document.createElement("label");
          const title = document.createElement("span");
          const input = document.createElement("input");
          input.dataset.parameterName = name;
          input.dataset.parameterSource = filter.source || "querystring";
          input.placeholder = [filter.sourceAlias, filter.field, filter.operator].filter(Boolean).join(" ");
          input.required = !!filter.required;
          title.textContent = name + (filter.required ? " *" : "");
          label.appendChild(title);
          label.appendChild(input);
          parameterFields.appendChild(label);
        });
        parameterFields.querySelectorAll("input").forEach(function (input) {
          input.addEventListener("input", refreshPreview);
        });
      }

      function buildRequest() {
        const request = { code: selectedQuery ? selectedQuery.code : "", parameters: {} };
        parameterFields.querySelectorAll("input[data-parameter-name]").forEach(function (input) {
          const name = input.dataset.parameterName;
          const source = input.dataset.parameterSource || "querystring";
          const value = input.value;
          if (!name || value === "") return;
          if (!request.parameters[source]) request.parameters[source] = {};
          request.parameters[source][name] = value;
        });
        if (!Object.keys(request.parameters).length) {
          request.parameters.querystring = {};
        }
        return request;
      }

      function refreshPreview() {
        requestPreview.textContent = pretty(buildRequest());
      }

      function recordsFromPayload(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== "object") return [];
        if (Array.isArray(payload.data)) return payload.data;
        if (Array.isArray(payload.records)) return payload.records;
        if (payload.data && Array.isArray(payload.data.records)) return payload.data.records;
        if (payload.result && Array.isArray(payload.result)) return payload.result;
        return [];
      }

      function renderResultGrid(records) {
        currentRecords = records.slice();
        const first = records[0] || {};
        const columns = Object.keys(first).map(function (field) {
          return { field, title: field, width: 160, lockable: true, locked: lockedColumns.has(field) };
        }).sort(function (left, right) {
          return Number(!!right.locked) - Number(!!left.locked);
        });
        const kendoGrid = grid();
        kendoGrid.setOptions({
          height: "100%",
          scrollable: true,
          toolbar: ["excel"],
          excel: {
            fileName: "sursum-consulta-salva.xlsx",
            allPages: true,
            filterable: true
          },
          columnMenu: true,
          columnMenuOpen: appendColumnLockActions,
          columns: columns.length ? columns : [{ field: "mensagem", title: "Mensagem", width: 220, lockable: true }]
        });
        kendoGrid.dataSource.pageSize(50);
        kendoGrid.dataSource.data(records.length ? records : [{ mensagem: "Nenhum registro retornado." }]);
        appendCloseButtonToGridNavigation();
      }

      function rerenderCurrentGrid() {
        renderResultGrid(currentRecords);
      }

      function toggleGridMaximized() {
        gridShell.classList.toggle("grid-maximized");
        maximizeGridButton.textContent = gridShell.classList.contains("grid-maximized") ? "Restaurar grid" : "Maximizar grid";
        appendCloseButtonToGridNavigation();
        setTimeout(function () {
          grid().resize(true);
        }, 0);
      }

      function closeGridMaximized() {
        if (!gridShell.classList.contains("grid-maximized")) return;
        gridShell.classList.remove("grid-maximized");
        maximizeGridButton.textContent = "Maximizar grid";
        closeMaximizedGridButton.style.display = "none";
        setTimeout(function () {
          grid().resize(true);
        }, 0);
      }

      function appendCloseButtonToGridNavigation() {
        const pager = grid().wrapper.find(".k-grid-pager");
        if (!pager.length) return;
        if (!pager.find("#closeMaximizedGridButton").length) {
          pager.append(closeMaximizedGridButton);
        }
        closeMaximizedGridButton.style.display = gridShell.classList.contains("grid-maximized") ? "inline-flex" : "none";
      }

      function appendColumnLockActions(event) {
        const field = event.field;
        const container = $(event.container);
        if (!field || container.find(".sursum-column-lock-actions").length) return;
        const actions = $(
          "<div class='sursum-column-lock-actions'>" +
            "<button type='button' class='sursum-column-menu-action sursum-lock-column'>Congelar coluna</button>" +
            "<button type='button' class='sursum-column-menu-action sursum-unlock-column'>Liberar coluna</button>" +
          "</div>"
        );
        actions.find(".sursum-lock-column").on("click", function () {
          lockedColumns.add(field);
          grid().thead.find(".k-grid-column-menu").each(function () {
            const menu = $(this).data("kendoColumnMenu");
            if (menu) menu.close();
          });
          rerenderCurrentGrid();
        });
        actions.find(".sursum-unlock-column").on("click", function () {
          lockedColumns.delete(field);
          grid().thead.find(".k-grid-column-menu").each(function () {
            const menu = $(this).data("kendoColumnMenu");
            if (menu) menu.close();
          });
          rerenderCurrentGrid();
        });
        container.append(actions);
      }

      function validateRequiredParameters() {
        const missing = [];
        parameterFields.querySelectorAll("input[required]").forEach(function (input) {
          if (!input.value) missing.push(input.dataset.parameterName);
        });
        return missing;
      }

      async function loadSavedQueries() {
        const payload = await getJson("saved-query-store.php");
        if (!payload || !payload.success) {
          throw new Error((payload && payload.error) || "Falha ao listar consultas salvas.");
        }
        combo().setDataSource(new kendo.data.DataSource({ data: payload.data || [] }));
        if ((payload.data || []).length) {
          combo().value(payload.data[0].code);
          await loadSelectedQuery(payload.data[0].code);
        } else {
          setStatus("Nenhuma consulta salva encontrada.");
        }
      }

      async function loadSelectedQuery(code) {
        if (!code) return;
        const payload = await getJson("saved-query-store.php?action=detail&code=" + encodeURIComponent(code));
        if (!payload || !payload.success) {
          throw new Error((payload && payload.error) || "Falha ao carregar consulta salva.");
        }
        selectedQuery = payload.data;
        const filters = selectedQuery.externalFilters || [];
        queryInfo.textContent = selectedQuery.code + " | filtros externos: " + filters.length;
        renderParameterFields(filters);
        refreshPreview();
        setStatus("Consulta carregada: " + selectedQuery.code + ".");
      }

      async function runQuery() {
        if (!selectedQuery || !selectedQuery.code) {
          setStatus("Selecione uma consulta salva.");
          return;
        }
        const missing = validateRequiredParameters();
        if (missing.length) {
          setStatus("Preencha os parametros obrigatorios: " + missing.join(", ") + ".");
          return;
        }
        const request = buildRequest();
        runButton.disabled = true;
        try {
          setStatus("Executando consulta salva...");
          const response = await postJson(pasoeProxyUrl("/query"), request);
          if (!response.payload) {
            renderResultGrid([{ erro: response.raw || "Resposta nao JSON.", http: response.status }]);
            setStatus("Resposta nao JSON. HTTP " + response.status + ".");
            return;
          }
          const records = recordsFromPayload(response.payload);
          renderResultGrid(records);
          setStatus("Consulta concluida. Registros: " + records.length + ". HTTP " + response.status + ".");
        } catch (error) {
          renderResultGrid([{ erro: error.message || String(error) }]);
          setStatus("Falha ao executar consulta.");
        } finally {
          runButton.disabled = false;
        }
      }

      function initWidgets() {
        kendo.culture("pt-BR");
        $("button").kendoButton();
        $("#savedQueryCombo").kendoComboBox({
          dataTextField: "name",
          dataValueField: "code",
          filter: "contains",
          suggest: true,
          change: function () {
            loadSelectedQuery(this.value()).catch(function (error) { setStatus(error.message); });
          }
        });
        $("#resultGrid").kendoGrid({
          dataSource: { data: [], pageSize: 50 },
          height: "100%",
          scrollable: true,
          toolbar: ["excel"],
          excel: {
            fileName: "sursum-consulta-salva.xlsx",
            allPages: true,
            filterable: true
          },
          sortable: true,
          filterable: true,
          resizable: true,
          reorderable: true,
          columnMenu: true,
          columnMenuOpen: appendColumnLockActions,
          pageable: { pageSize: 50, pageSizes: [50, 100, 200, 500] },
          noRecords: { template: "Nenhum registro retornado." },
          columns: [{ field: "mensagem", title: "Mensagem", width: 220, lockable: true }]
        });
        runButton.addEventListener("click", runQuery);
        maximizeGridButton.addEventListener("click", toggleGridMaximized);
        closeMaximizedGridButton.addEventListener("click", closeGridMaximized);
      }

      $(function () {
        initWidgets();
        if (window.SursumUiReady) window.SursumUiReady();
        const ready = window.SursumContext && typeof SursumContext.whenReady === "function"
          ? SursumContext.whenReady()
          : Promise.resolve();
        ready.then(loadSavedQueries).catch(function (error) { setStatus(error.message); });
      });
    })();
  </script>
</body>
</html>
