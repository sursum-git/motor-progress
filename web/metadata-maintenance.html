<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atualizacao em lote de metadados</title>
  <link rel="stylesheet" href="vendor/kendo/styles/default-main.css">
  <link rel="stylesheet" href="ui-ready.css?v=20260617-grid-center">
  <link rel="stylesheet" href="query-builder.css">
  <link rel="stylesheet" href="metadata-maintenance.css?v=20260622-manual-pages">
</head>
<body class="sursum-ui-pending">
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Sursum Dynamic Query - Atualizacao em lote de metadados</p>
      </div>
      <div class="endpoint-card metadata-context-card">
        <div class="endpoint-field">
          <label for="apiCompany">Empresa</label>
          <input id="apiCompany" placeholder="Selecione a empresa">
        </div>
        <input id="apiBaseUrl" type="hidden" value="http://localhost:8890/web/SursumDynamicQuery">
        <div class="endpoint-field">
          <label for="dbCombo">Banco de dados</label>
          <input id="dbCombo">
        </div>
        <div class="endpoint-field">
          <label for="tableName">Tabela</label>
          <input id="tableName" placeholder="Opcional para criar fila de uma tabela">
        </div>
        <div class="action-row tight">
          <button id="reloadTables">Carregar tabelas</button>
          <button id="openTableBrowser">Navegador</button>
        </div>
      </div>
    </header>

    <main class="wizard-workspace metadata-maintenance">
      <section class="panel is-active">
        <div class="panel-title">
          <h2>Atualizacao em lote</h2>
          <span id="resultSummary">Crie uma fila para atualizar joins OF e view-as.</span>
        </div>
        <div class="metadata-batch-grid">
          <div class="metadata-batch-options">
            <label class="metadata-batch-switch"><span class="switch-label">Atualizar joins OF</span><input id="includeRelations" type="checkbox" checked><span class="switch-control"></span></label>
            <label class="metadata-batch-switch"><span class="switch-label">Atualizar view-as</span><input id="includeViewAs" type="checkbox" checked><span class="switch-control"></span></label>
            <label class="metadata-batch-switch"><span class="switch-label">Apenas tabela informada</span><input id="onlyCurrentTable" type="checkbox"><span class="switch-control"></span></label>
            <div class="endpoint-field batch-parallel-field">
              <label for="parallelExecutions">Execucoes simultaneas</label>
              <input id="parallelExecutions" type="number" min="1" value="1">
            </div>
            <div class="endpoint-field batch-existing-field">
              <label for="existingMetadataBehavior">Metadado existente</label>
              <input id="existingMetadataBehavior">
            </div>
            <div class="action-row tight">
              <button id="cancelJob">Cancelar pendentes</button>
              <button id="reprocessAllJob">Reprocessar tudo</button>
              <button id="createJob">Criar fila</button>
              <button id="runJob">Executar</button>
              <button id="pauseJob">Pausar</button>
            </div>
            <div id="jobSummary" class="job-summary">Nenhuma fila criada.</div>
          </div>
          <div id="jobGrid"></div>
        </div>
      </section>
    </main>

    <footer class="wizard-footer">
      <div></div>
      <div id="statusBox" class="status-box">Pronto.</div>
      <div></div>
    </footer>
  </div>

  <script src="vendor/jquery/jquery-4.0.0.min.js"></script>
  <script src="vendor/kendo/js/kendo.all.min.js"></script>
  <script src="vendor/kendo/js/cultures/kendo.culture.pt-BR.min.js"></script>
  <script src="vendor/kendo/js/messages/kendo.messages.pt-BR.min.js"></script>
  <script src="vendor/kendo/kendo-license.js"></script>
  <script src="ui-ready.js?v=20260622-silent-grid-ajax"></script>
  <script src="auth-guard.js"></script>
  <script src="context-manager.js?v=20260617-context-ready"></script>
  <script src="metadata-maintenance.js?v=20260622-batch-grid-pagination"></script>
</body>
</html>
