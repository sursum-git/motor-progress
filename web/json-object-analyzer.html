    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .workbench {
      display: grid;

      gap: 12px;
      min-height: 260px;
      max-height: 42vh;

    .panel,

    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #d8dee4;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      min-height: 34px;
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #475569;
    }
    button:disabled {
      background: #8fa4cf;
      cursor: wait;
    }
    textarea,
    pre {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 0;
      background: #fbfcfd;
      color: #111827;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.45;
      resize: none;
      white-space: pre;
    }
    textarea:focus {
      outline: 2px solid #93c5fd;
      outline-offset: -2px;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-left: 4px solid #1d4ed8;
      color: #344150;
    }
    .grid-area {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      min-height: 0;
    }
    #resultGrid {
      min-height: 0;
      height: 100%;
    }
    @media (max-width: 880px) {
      body {
        padding: 10px;
      }
      main {
        grid-template-rows: auto minmax(360px, 1fr);
      }
      .workbench {
        grid-template-columns: 1fr;
        max-height: 52vh;
      }
      .status {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>

  <script src="ui-ready.js?v=20260616-grid-loading"></script>
  <script>
    (function () {
      "use strict";

      const DEFAULT_API_BASE = "https://192.168.0.111:9911/med/web/SursumDynamicQuery";
      const PROGRAM_CODE = "analise-json-object10";
      const jsonInput = document.getElementById("jsonInput");
      const requestPreview = document.getElementById("requestPreview");
      const statusBox = document.getElementById("statusBox");
      const summaryBox = document.getElementById("summaryBox");
      const runButton = document.getElementById("runButton");
      const formatButton = document.getElementById("formatButton");
      const fileButton = document.getElementById("fileButton");
      const fileInput = document.getElementById("fileInput");

      function setStatus(message) {
        statusBox.textContent = message;
      }

      function pretty(value) {
        return JSON.stringify(value, null, 2);
      }

      function jsonTextForProgress(value) {
        return pretty(value).replace(/[^\x00-\x7F]/g, function (char) {
          return "\\u" + char.charCodeAt(0).toString(16).padStart(4, "0");
        });
      }

      function decodeUnicodeEscapes(value) {
        if (typeof value !== "string") return value;
        return value.replace(/\\u([0-9a-fA-F]{4})/g, function (_, hex) {
          return String.fromCharCode(parseInt(hex, 16));
        });
      }

      function decodeRecord(record) {
        if (!record || typeof record !== "object") return record;
        return Object.assign({}, record, {
          nome: decodeUnicodeEscapes(record.nome),
          caminho: decodeUnicodeEscapes(record.caminho),
          valor: decodeUnicodeEscapes(record.valor)
        });
      }

      function currentApiBase() {
        if (window.SursumContext && typeof SursumContext.getCurrentApiBase === "function") {
          return String(SursumContext.getCurrentApiBase() || DEFAULT_API_BASE).replace(/\/+$/, "");
        }
        return DEFAULT_API_BASE;
      }

      function pasoeProxyUrl(path) {
        return "pasoe-proxy.php?target=" + encodeURIComponent(currentApiBase() + path);
      }

      function parseJsonInput() {
        const text = String(jsonInput.value || "").trim();
        if (!text) throw new Error("Informe um JSON.");
        return JSON.parse(text);
      }

      function buildRequest() {
        return {
          program: PROGRAM_CODE,
          parameters: {
            jsonText: jsonTextForProgress(parseJsonInput()),
            targetCodepage: "ISO8859-1",
            escapeUnicodeOutput: true
          }
        };
      }

      function refreshPreview() {
        try {
          requestPreview.textContent = pretty(buildRequest());
          setStatus("Pronto para analisar.");
        } catch (error) {
          requestPreview.textContent = "";
          setStatus("JSON invalido: " + error.message);
        }
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(body)
        });
        const text = await response.text();
        try {
          return { status: response.status, payload: JSON.parse(text), raw: text };
        } catch (error) {
          return { status: response.status, payload: null, raw: text };
        }
      }

      function recordsFromPayload(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== "object") return [];
        if (Array.isArray(payload.records)) return payload.records;
        if (payload.data && Array.isArray(payload.data.records)) return payload.data.records;
        if (Array.isArray(payload.data)) return payload.data;
        return [];
      }

      function renderGrid(records) {
        summaryBox.textContent = "Registros: " + records.length;
        const grid = $("#resultGrid").data("kendoGrid");
        grid.dataSource.data(records.length ? records : [{ caminho: "", nivel: "", tipo: "info", valor: "Nenhum registro retornado." }]);
      }

      function renderError(message, status) {
        renderGrid([{ caminho: "", nivel: "", tipo: "erro", valor: message, http: status || "" }]);
      }

      async function runAnalysis() {
        let request;
        try {
          request = buildRequest();
        } catch (error) {
          setStatus("JSON invalido: " + error.message);
          return;
        }

        runButton.disabled = true;
        requestPreview.textContent = pretty(request);
        try {
          setStatus("Executando analise no PASOE...");
          const response = await postJson(pasoeProxyUrl("/program/execute"), request);
          if (!response.payload) {
            renderError(response.raw || "Resposta nao JSON.", response.status);
            setStatus("Resposta nao JSON. HTTP " + response.status + ".");
            return;
          }
          if (response.payload.success === false) {
            renderError(response.payload.error || "Programa retornou erro.", response.status);
            setStatus("Programa retornou erro. HTTP " + response.status + ".");
            return;
          }
          const records = recordsFromPayload(response.payload).map(decodeRecord);
          renderGrid(records);
          setStatus("Analise concluida. HTTP " + response.status + ".");
        } catch (error) {
          renderError(error.message || String(error), "");
          setStatus("Falha ao executar analise.");
        } finally {
          runButton.disabled = false;
        }
      }

      function formatJson() {
        try {
          jsonInput.value = pretty(parseJsonInput());
          refreshPreview();
        } catch (error) {
          setStatus("JSON invalido: " + error.message);
        }
      }

      function loadJsonFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function () {
          jsonInput.value = String(reader.result || "");
          refreshPreview();
        };
        reader.onerror = function () {
          setStatus("Falha ao ler arquivo JSON.");
        };
        reader.readAsText(file, "UTF-8");
      }

      function initGrid() {
        kendo.culture("pt-BR");
        $("button").kendoButton();
        $("#resultGrid").kendoGrid({
          dataSource: { data: [], pageSize: 50 },
          height: "100%",
          scrollable: true,
          toolbar: ["excel"],
          excel: {
            fileName: "sursum-analise-json-object.xlsx",
            allPages: true,
            filterable: true
          },
          sortable: true,
          filterable: true,
          resizable: true,
          reorderable: true,
          pageable: { pageSize: 50, pageSizes: [50, 100, 200, 500] },
          noRecords: { template: "Nenhum registro retornado." },
          columns: [
            { field: "id", title: "ID", width: 80 },
            { field: "parentId", title: "Pai", width: 80 },
            { field: "nivel", title: "Nivel", width: 90 },
            { field: "nome", title: "Nome", width: 180 },
            { field: "caminho", title: "Caminho", width: 360 },
            { field: "tipo", title: "Tipo", width: 110 },
            { field: "indice", title: "Indice", width: 90 },
            { field: "valor", title: "Valor", width: 260 }
          ]
        });
      }

      runButton.addEventListener("click", runAnalysis);
      formatButton.addEventListener("click", formatJson);
      fileButton.addEventListener("click", function () { fileInput.click(); });
      fileInput.addEventListener("change", function () {
        loadJsonFile(fileInput.files && fileInput.files[0]);
        fileInput.value = "";
      });
      jsonInput.addEventListener("input", refreshPreview);

      $(function () {
        initGrid();
        if (window.SursumUiReady) window.SursumUiReady();
        const ready = window.SursumContext && typeof SursumContext.whenReady === "function"
          ? SursumContext.whenReady()
          : Promise.resolve();
        ready.then(refreshPreview).catch(function (error) { setStatus(error.message); });
      });
    })();
  </script>
