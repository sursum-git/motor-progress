<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de ambientes e empresas</title>
  <link rel="stylesheet" href="vendor/kendo/styles/default-main.css">
  <link rel="stylesheet" href="ui-ready.css?v=20260616-grid-loading">
  <link rel="stylesheet" href="query-builder.css">
</head>
<body class="sursum-ui-pending">
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Sursum Dynamic Query</p>
        <h1>Cadastro de ambientes e empresas</h1>
        <p class="lead">Cadastre os ambientes PASOE e as empresas de cada ambiente. O vinculo do ambiente com cliente fica em uma tela separada.</p>
      </div>
      <div class="endpoint-card">
        <div class="action-row tight">
          <button id="openClientConfig">Abrir clientes</button>
          <button id="openLinkConfig">Abrir vinculos</button>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="panel-title">
        <h2>Ambientes</h2>
        <span>Persistencia em SQLite</span>
      </div>

      <div class="divider"></div>

      <div class="grid two">
        <label>Ambiente/PASOE
          <input id="endpointName" placeholder="Local PASOE">
        </label>
        <label>URL base
          <input id="endpointUrl" placeholder="http://localhost:8890/web/SursumDynamicQuery">
        </label>
      </div>
      <div class="grid five">
        <label>Servidor SSH
          <input id="endpointServidor" placeholder="192.168.0.42">
        </label>
        <label>Usuario SSH
          <input id="endpointUsuario" placeholder="usuario">
        </label>
        <label>Senha SSH
          <input id="endpointSenha" type="password" autocomplete="new-password">
        </label>
        <label>Arquivo PF
          <input id="endpointArquivoPf" placeholder="C:\caminho\datasul.pf">
        </label>
        <label>Arquivo alias
          <input id="endpointArquivoAlias" placeholder="C:\caminho\aliases.p">
        </label>
      </div>
      <div class="action-row tight">
        <button id="addEndpoint">Adicionar ambiente</button>
      </div>

      <div id="endpointsGrid"></div>
      <div id="statusBox" class="status-box">Pronto.</div>
    </section>
  </div>

  <div id="companyEditorWindow" style="display:none">
    <div class="grid three">
      <label>Ambiente atual
        <input id="environmentCombo" placeholder="Selecione o ambiente">
      </label>
      <label>Nome interno
        <input id="companyName" placeholder="CompanyId producao">
      </label>
      <label>Valor do parametro companyId
        <input id="companyCode" placeholder="empresa-xpto">
      </label>
    </div>

    <div class="action-row tight" style="margin: 8px 0 16px;">
      <button id="addCompany">Salvar empresa do ambiente</button>
      <button id="removeCompany">Remover empresa do ambiente</button>
    </div>

    <div id="companiesGrid"></div>
  </div>

  <script src="vendor/jquery/jquery-4.0.0.min.js"></script>
  <script src="vendor/kendo/js/kendo.all.min.js"></script>
  <script src="vendor/kendo/kendo-license.js"></script>
  <script src="ui-ready.js?v=20260616-grid-loading"></script>
  <script src="auth-guard.js"></script>

  <script src="context-manager.js"></script>
  <script src="endpoint-config.js?v=20260612-env-ssh-props"></script>
</body>
</html>
