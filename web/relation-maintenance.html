<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join manual</title>
  <link rel="stylesheet" href="vendor/kendo/styles/default-main.css">
  <link rel="stylesheet" href="ui-ready.css?v=20260617-grid-center">
  <link rel="stylesheet" href="query-builder.css">
  <link rel="stylesheet" href="metadata-maintenance.css?v=20260728-viewas-options">
</head>
<body class="sursum-ui-pending">
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Sursum Dynamic Query - Join manual</p>
      </div>
      <div class="endpoint-card metadata-context-card">
        <div class="endpoint-field">
          <label for="apiCompany">Empresa</label>
          <input id="apiCompany" placeholder="Selecione a empresa">
        </div>
        <input id="apiBaseUrl" type="hidden" value="http://localhost:8890/web/SursumDynamicQuery">
        <div class="endpoint-field">
          <label for="dbCombo">Banco de dados</label>
          <input id="dbCombo">
        </div>
        <div class="endpoint-field">
          <label for="tableName">Tabela</label>
          <input id="tableName" placeholder="Opcional para filtrar">
        </div>
        <div class="action-row tight">
          <button id="reloadTables">Carregar tabelas</button>
          <button id="openTableBrowser">Navegador</button>
        </div>
      </div>
    </header>

    <main class="wizard-workspace metadata-maintenance">
      <section class="panel is-active">
        <div class="panel-title">
          <h2>Join manual</h2>
          <span id="resultSummary">Cadastre joins manuais preservados pela atualizacao OF.</span>
        </div>
        <div class="metadata-grid-toolbar action-row tight">
          <button id="addRelation">Incluir join</button>
          <button id="loadRelations">Recarregar</button>
        </div>
        <div id="relationsGrid"></div>
      </section>
    </main>

    <footer class="wizard-footer">
      <div></div>
      <div id="statusBox" class="status-box">Pronto.</div>
      <div></div>
    </footer>
  </div>

  <div id="relationWindow" class="metadata-editor-window" style="display:none">
    <div class="metadata-window-form relation-window-form">
      <div class="endpoint-field">
        <label for="leftTable">Tabela esquerda</label>
        <input id="leftTable">
      </div>
      <div class="endpoint-field">
        <label for="leftField">Campo esquerdo</label>
        <input id="leftField">
      </div>
      <div class="endpoint-field">
        <label for="rightTable">Tabela direita</label>
        <input id="rightTable">
      </div>
      <div class="endpoint-field">
        <label for="rightField">Campo direito</label>
        <input id="rightField">
      </div>
      <div class="endpoint-field">
        <label for="relationType">Tipo</label>
        <input id="relationType">
      </div>
      <div class="action-row tight metadata-window-actions">
        <button id="saveRelation">Salvar</button>
        <button id="cancelRelation">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="vendor/jquery/jquery-4.0.0.min.js"></script>
  <script src="vendor/kendo/examples/content/shared/js/jszip.min.js"></script>
  <script src="vendor/kendo/js/kendo.all.min.js"></script>
  <script src="vendor/kendo/js/cultures/kendo.culture.pt-BR.min.js"></script>
  <script src="vendor/kendo/js/messages/kendo.messages.pt-BR.min.js"></script>
  <script src="vendor/kendo/kendo-license.js"></script>
  <script src="ui-ready.js?v=20260616-grid-loading"></script>
  <script src="auth-guard.js"></script>
  <script src="context-manager.js?v=20260617-context-ready"></script>
  <script src="metadata-maintenance.js?v=20260728-viewas-options"></script>
</body>
</html>
