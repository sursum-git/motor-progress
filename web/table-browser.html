<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de metadados por tabela</title>
  <link rel="stylesheet" href="vendor/kendo/styles/default-main.css">
  <link rel="stylesheet" href="ui-ready.css?v=20260617-grid-center">
  <link rel="stylesheet" href="query-builder.css?v=20260612-table-browser-toolbar">
  <link rel="stylesheet" href="table-browser.css?v=20260612-joins-sqlite">
</head>
<body class="sursum-ui-pending">
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">
          Sursum Dynamic Query - Consulta de metadados por tabela
          <span id="metadataHelp" class="help-icon" tabindex="0" aria-label="Ajuda">?</span>
        </p>
      </div>
      <div class="table-browser-toolbar">
        <div class="endpoint-card table-browser-search-card">
          <div class="endpoint-field">
            <label for="apiCompany">Empresa</label>
            <input id="apiCompany" placeholder="Selecione a empresa">
          </div>
          <input id="apiBaseUrl" type="hidden" value="http://localhost:8890/web/SursumDynamicQuery">
          <div class="endpoint-field">
            <label for="dbCombo">Banco de dados</label>
            <input id="dbCombo">
          </div>
          <div class="endpoint-field">
            <label for="tableName">Tabela</label>
            <div class="table-name-picker">
              <input id="tableName" placeholder="Ex.: ped-venda">
              <button id="openTableSelector" type="button" title="Selecionar tabela" aria-label="Selecionar tabela" class="table-search-button">⌕</button>
            </div>
          </div>
          <div class="action-row tight table-browser-search-actions">
            <button id="findTableBtn">Buscar Metadados</button>
            <button id="clearBtn">Limpar</button>
          </div>
        </div>

        <div class="endpoint-card table-browser-sync-card">
          <div class="metadata-sync-options" aria-label="Atualização de metadados">
            <div class="metadata-sync-title">Atualização de metadados</div>
            <div class="metadata-sync-checks">
              <label><input id="syncBanks" type="checkbox" checked> Bancos</label>
              <label><input id="syncAliases" type="checkbox" checked> Aliases</label>
              <label><input id="syncTables" type="checkbox" checked> Tabelas</label>
              <label><input id="syncFields" type="checkbox" checked> Campos</label>
              <label><input id="syncIndices" type="checkbox" checked> Índices</label>
              <label><input id="syncViewAs" type="checkbox" checked> View-as</label>
            </div>
            <button id="refreshMetadata">Atualizar metadados</button>
          </div>
        </div>
      </div>
    </header>

    <main class="wizard-workspace">
      <section class="panel is-active">
        <div class="panel-title">
          <h2>Resultados</h2>
          <span id="resultSummary">Escolha banco e tabela para carregar os metadados.</span>
        </div>
        <div id="metadataTabs">
          <ul>
            <li class="k-state-active">Campos</li>
            <li>Índices</li>
            <li>Joins</li>
            <li>Dados</li>
          </ul>
          <div>
            <div id="fieldsGrid"></div>
          </div>
          <div>
            <div id="indexesGrid"></div>
          </div>
          <div>
            <div class="join-toolbar">
              <button id="refreshCurrentJoins">Atualizar joins OF</button>
            </div>
            <div id="joinsGrid"></div>
          </div>
          <div>
            <div class="browse-toolbar">
              <div class="endpoint-field">
                <label for="browsePageSize">Registros</label>
                <input id="browsePageSize">
              </div>
              <div class="endpoint-field">
                <label for="browseDirection">Ordem</label>
                <input id="browseDirection">
              </div>
              <div class="endpoint-field browse-field-select">
                <label for="browseFields">Campos exibidos</label>
                <select id="browseFields" multiple></select>
              </div>
              <div class="action-row tight browse-actions">
                <button id="browseFirstBtn">Carregar primeiros</button>
                <button id="browseNextBtn">Próximos</button>
                <button id="browseInvertBtn">Inverter ordem</button>
              </div>
            </div>
            <div class="browse-summary">
              <span id="browseKeyInfo">Chave: -</span>
              <span id="browseMoreInfo">Sem dados carregados.</span>
            </div>
            <div id="dataGrid"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="wizard-footer">
      <div></div>
      <div id="statusBox" class="status-box">Pronto.</div>
      <div></div>
    </footer>
  </div>

  <div id="tableSelectorWindow">
    <p id="tableSelectorMessage">Selecione uma tabela disponível:</p>
    <div id="tableSelectorGrid"></div>
    <div class="action-row tight">
      <button id="applyTableSelection">Selecionar</button>
      <button id="cancelTableSelection">Cancelar</button>
    </div>
  </div>

  <div id="addCompanyWindow" style="display:none">
    <form id="addCompanyForm">
      <div class="endpoint-field">
        <label for="newCompanyName">Nome do cliente</label>
        <input id="newCompanyName" name="newCompanyName" required data-required-msg="Informe o nome do cliente." placeholder="Ex.: Cliente ABC">
        <span class="k-invalid-msg" data-for="newCompanyName"></span>
      </div>
      <div class="endpoint-field">
        <label for="newCompanyEndpointName">Nome do ambiente</label>
        <input id="newCompanyEndpointName" name="newCompanyEndpointName" required data-required-msg="Informe o nome do ambiente." placeholder="Ex.: PASOE produção">
        <span class="k-invalid-msg" data-for="newCompanyEndpointName"></span>
      </div>
      <div class="endpoint-field">
        <label for="newCompanyEndpointUrl">URL do endpoint</label>
        <input id="newCompanyEndpointUrl" name="newCompanyEndpointUrl" required data-required-msg="Informe a URL do endpoint." data-endpointurl="true" data-endpointurl-msg="Informe uma URL válida, por exemplo: http://localhost:8890/web/SursumDynamicQuery." placeholder="http://localhost:8890/web/SursumDynamicQuery">
        <span class="k-invalid-msg" data-for="newCompanyEndpointUrl"></span>
      </div>
      <div class="action-row tight">
        <button id="confirmAddCompany" type="button">Salvar</button>
        <button id="cancelAddCompany" type="button">Cancelar</button>
      </div>
    </form>
  </div>

  <script src="vendor/jquery/jquery-4.0.0.min.js"></script>
  <script src="vendor/kendo/js/kendo.all.min.js"></script>
  <script src="vendor/kendo/kendo-license.js"></script>
  <script src="ui-ready.js?v=20260616-grid-loading"></script>
  <script src="auth-guard.js"></script>

  <script src="context-manager.js"></script>
  <script src="table-browser.js?v=20260612-viewas-sqlite"></script>
</body>
</html>
